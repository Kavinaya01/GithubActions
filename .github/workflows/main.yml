name: Python Workflow

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  python-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python
        run: python --version

      - name: Check Syntax
        run: python -m py_compile dice.py

      - name: Run Dice Program
        run: |
          printf "n\n" | python dice.py

      - name: Finished
        run: echo "Workflow completed"
